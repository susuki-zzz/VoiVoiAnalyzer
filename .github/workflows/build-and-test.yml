name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    name: Windows (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Configure CMake
      run: |
        cmake -S . -B build `
          -GNinja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DBUILD_TESTING=ON
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --build-config ${{ matrix.build_type }}
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-windows-${{ matrix.build_type }}
        path: build/Testing/Temporary/

  build-linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-11
            cxx: g++-11
          - compiler: clang
            cc: clang-14
            cxx: clang++-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build ${{ matrix.cc }} ${{ matrix.cxx }}
    
    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -S . -B build \
          -GNinja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTING=ON
    
    - name: Build
      run: cmake --build build
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-linux-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: build/Testing/Temporary/

  build-with-sanitizers:
    name: Linux (Sanitizers)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build clang-14
    
    - name: Configure CMake
      env:
        CC: clang-14
        CXX: clang++-14
      run: |
        cmake -S . -B build \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DYVC_ENABLE_SANITIZERS=ON
    
    - name: Build
      run: cmake --build build
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-sanitizers
        path: build/Testing/Temporary/

  coverage:
    name: Coverage Report
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-11 g++-11 lcov
    
    - name: Configure CMake
      env:
        CC: gcc-11
        CXX: g++-11
      run: |
        cmake -S . -B build \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DYVC_ENABLE_COVERAGE=ON
    
    - name: Build
      run: cmake --build build
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
    
    - name: Generate coverage report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info \
          '/usr/*' \
          '*/third_party/*' \
          '*/tests/*' \
          '*/build/*' \
          --output-file coverage_filtered.info
        lcov --list coverage_filtered.info
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: build/coverage_filtered.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
